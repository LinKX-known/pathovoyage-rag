[project]
name = "giant"
version = "0.1.0"
description = "Gigapixel Image Agent for Navigating Tissue"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "GIANT Team" }]
keywords = ["pathology", "wsi", "llm", "agent", "gigapixel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # 全切片图像读取
    "openslide-python>=1.4.3",
    "openslide-bin>=4.0.0.10",
    # 配置与数据校验
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    # 命令行入口
    "typer>=0.20.0",
    # 数值与图像处理
    "numpy>=2.2.6,<2.4.0",
    "pillow>=12.0.0",
    # 大模型接口
    "anthropic>=0.75.0",
    "openai>=2.13.0",
    "tenacity>=9.1.2",
    "httpx>=0.28.1",
    # 数据与模型下载
    "datasets>=4.4.1",
    "huggingface_hub>=1.2.3",
    # 计算机视觉与组织分割
    "opencv-python>=4.12.0.88",
    "scipy>=1.16.3",
    "scikit-image>=0.25.2",
    # 裁剪与元数据缓存
    "diskcache>=5.6.3",
    # 并发请求限速
    "aiolimiter>=1.2.1",
    # 终端输出及医学图像支持
    "rich>=14.2.0",
    "tqdm>=4.67.1",
    "pydicom>=3.0.1",
]

# 可选的病理图文模型候选区预筛依赖。
[project.optional-dependencies]
plip = [
    "torch>=2.7.0",
    "transformers>=4.46.0",
]

# 从支持新款显卡的计算平台索引获取深度学习框架。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.scripts]
giant = "giant.cli.main:app"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giant"]
